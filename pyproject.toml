[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-pulse-dashboard"
version = "0.1.0"
description = "Reproducible Canada, US and Taiwan market analysis with KD, PCA and walk-forward forecasts"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "requests>=2.32,<3", "plotly>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
market-pulse = "market_pulse.cli:main"

[tool.setuptools]
packages = ["market_pulse"]

[tool.setuptools.package-data]
market_pulse = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
